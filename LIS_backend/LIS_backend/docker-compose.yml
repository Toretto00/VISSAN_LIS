version: '3.4'

services:
  sqlserver:
    container_name: sqlserver
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      MSSQL_SA_PASSWORD: "1236fG543$"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: always

  lis_backend:
    container_name: lisbackend
#   image: ${DOCKER_REGISTRY-}lisbackend
    build:
      context: .
      dockerfile: Dockerfile
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - ASPNETCORE_URLS=http://+:8080
    - "DatabaseSettings:DefaultConnection=Server=sqlserver;Database=LISBackend;User Id=sa;Password=1236fG543$;TrustServerCertificate=true"
    ports:
    - "8080:8080"
    depends_on:
    - sqlserver
    restart: always

volumes:
  sql_data:
    name: sql_data
